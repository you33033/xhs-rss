name: 更新小红书订阅

on:
  schedule:
    # 每 3 小时一次（UTC），避开整点
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: xhs-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查 Secret
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: |
          if [ -z "$XHS_COOKIE" ]; then
            echo "::error::还没设置 XHS_COOKIE。到 Settings → Secrets and variables → Actions 里新建一个 Secret。"
            exit 1
          fi

      - name: 生成订阅
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: python scripts/build_feed.py

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          commit_message: "更新订阅 ${{ github.run_number }}"

      - name: 恢复后关闭提醒
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --search 'in:title "订阅更新失败"' --json number -q '.[0].number' || true)
          if [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
              --comment "订阅已恢复正常，自动关闭这条提醒。"
          fi

      - name: 失败时开 Issue 提醒
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --search 'in:title "订阅更新失败"' --json number -q '.[0].number' || true)
          if [ -n "$num" ]; then
            echo "已有未关闭的提醒 Issue，跳过，避免刷屏"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "⚠️ 订阅更新失败（多半是小红书 Cookie 过期）" \
            --body "@${{ github.repository_owner }} 订阅更新失败了。

          **怎么修**

          1. 手机打开本机页面 \`http://127.0.0.1:8765\`，重新扫码登录小红书
          2. 点「复制 Cookie」
          3. 到仓库 **Settings → Secrets and variables → Actions**，更新 \`XHS_COOKIE\`
          4. 回到 **Actions** 点一次 **Run workflow**

          失败详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          恢复后这条 Issue 会自动关闭。"
